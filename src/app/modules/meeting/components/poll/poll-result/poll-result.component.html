<div class="poll-result-container">
  <div class="header">
    <div class="status-badge" [class.active]="isActive">
      {{ isActive ? 'Active' : 'Ended' }}
    </div>
    <h3>Poll Results</h3>
    <div class="question">{{ poll.question }}</div>
    <div class="meta">{{ totalVotes }} votes</div>
  </div>

  <div class="results-list">
    <!-- Short Answer List -->
    <div *ngIf="poll.type === 'Short Answer'" class="text-responses">
        <div *ngIf="textResponses.length === 0" class="no-responses">No responses yet</div>
        <div *ngFor="let response of textResponses" class="text-response-item">
            {{ response }}
        </div>
    </div>

    <!-- Choie List -->
    <ng-container *ngIf="poll.type !== 'Short Answer'">
        <div class="result-item" *ngFor="let option of poll.options">
        <div class="item-header">
            <span class="label">{{ option.text }}</span>
            <span class="count">{{ results[option.id] || 0 }} ({{ getPercentage(option.id) }}%)</span>
        </div>
        <div class="progress-track">
            <div 
            class="progress-bar" 
            [style.width.%]="getPercentage(option.id)"
            [class.winner]="isActive && (results[option.id] || 0) === maxVotes && maxVotes > 0"
            ></div>
        </div>
        </div>
    </ng-container>
  </div>

  <div class="actions" *ngIf="isHost">
    <button class="btn-end" *ngIf="isActive" (click)="onClose()">End Poll</button>
    <button class="btn-export" *ngIf="isActive || maxVotes > 0" (click)="onExport()">
       <span class="material-icons" style="font-size: 18px; vertical-align: middle; margin-right: 4px;">download</span> 
       Export CSV
    </button>
    <button class="btn-reset" *ngIf="!isActive" (click)="onReset()">Create New Poll</button>
  </div>
</div>
