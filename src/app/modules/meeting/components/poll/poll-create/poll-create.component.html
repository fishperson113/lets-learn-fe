<div class="poll-create-container">
  <div class="header">
    <h3>Create a Poll</h3>
  </div>

  <div class="form-group">
    <label>Poll Type</label>
    <select [(ngModel)]="type" class="form-control type-select">
        <option value="Multiple Choice">Multiple Choice</option>
        <option value="Short Answer">Short Answer</option>
        <option value="True/False">True/False</option>
    </select>
  </div>

  <div class="form-group">
    <label>Question</label>
    <textarea 
      [(ngModel)]="question" 
      placeholder="Ask a question..."
      rows="3"
      class="form-control"
    ></textarea>
  </div>

  <div class="form-group" *ngIf="type === 'Multiple Choice'">
    <label>Options</label>
    <div class="option-list">
      <div *ngFor="let option of options; let i = index" class="option-item">
        <input 
          type="text" 
          [(ngModel)]="option.text" 
          [placeholder]="'Option ' + (i + 1)"
          class="form-control"
        >
        <button 
          class="remove-btn" 
          (click)="removeOption(i)" 
          title="Remove option"
        >
          <span class="material-icons">close</span>
        </button>
      </div>
    </div>
    <button class="add-option-btn" (click)="addOption()">
      <span class="material-icons">add_circle_outline</span> Add Another Option
    </button>
  </div>
  
  <div class="form-group" *ngIf="type !== 'Short Answer' && type !== 'True/False'">
    <button class="import-btn" (click)="toggleQuestionBank()">
      <span class="material-icons">library_books</span> Import from Question Bank
    </button>
  </div>

  <div class="settings-group" *ngIf="type === 'Multiple Choice'">
    <label class="checkbox-label">
      <input type="checkbox" [(ngModel)]="multipleChoice">
      <span>Allow multiple choice</span>
    </label>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" (click)="onCancel()">Cancel</button>
    <button class="btn btn-primary" (click)="onSubmit()" [disabled]="!isValid()">
      Create Poll
    </button>
  </div>

  <!-- Question Bank Overlay -->
  <div class="bank-overlay" *ngIf="showQuestionBank">
    <app-question-bank 
      (selectQuestion)="onQuestionSelected($event)"
      (close)="toggleQuestionBank()">
    </app-question-bank>
  </div>
</div>
