<div class="history-container">
  <div class="history-section">
    <!-- Chart Section -->
    <div class="chart-container" *ngIf="chartSegments.length > 0">
      <app-bar-chart [segments]="chartSegments" title="Session Duration (mins)"></app-bar-chart>
    </div>

    <h3>Past Sessions</h3>
    <div class="session-list">
      <div class="session-item" *ngFor="let session of sessions">
        <div class="session-date-col">
          <i class="material-icons">event</i>
          <span class="date">{{ session.startTime | date:'medium' }}</span>
        </div>
        
        <div class="session-stats-col">
          <div class="stat-badge">
            <i class="material-icons">schedule</i>
            <span>{{ getDuration(session) }} mins</span>
          </div>
          <div class="stat-badge">
            <i class="material-icons">group</i>
            <span>{{ session.attendeeCount }} attendees</span>
          </div>
        </div>

        <div class="session-actions-col">
          <button class="btn-download" (click)="exportSession(session)" [title]="session.attendanceCsvUrl ? 'Download Attendance CSV' : 'No CSV Available'" [disabled]="!session.attendanceCsvUrl">
            <i class="material-icons">download</i>
            <span>Download CSV</span>
          </button>
        </div>
      </div>
      
      <div class="empty-state" *ngIf="sessions.length === 0">
        <div class="empty-icon">
          <i class="material-icons">history</i>
        </div>
        <p>No past sessions recorded yet.</p>
      </div>
    </div>
  </div>
</div>
