<div class="tab-people">
  <!-- Instructor Section -->
  <div class="people-section">
    <div class="section-title">Instructor</div>
    <div class="person-row" *ngIf="instructor">
      <img class="avatar" [src]="instructor.avatar" [alt]="instructor.username + ' - Giảng viên khóa học'" />
      <span class="person-name">{{ instructor.username }}</span>
    </div>
  </div>

  <!-- Members Section -->
  <div class="people-section">
    <div class="section-title" style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <span>Members</span>
        @if(canEdit) {
        <app-button 
          variant="primary" 
          label="Add Student"
          (click)="openAddStudentDialog()"
        >
          <span class="material-symbols-outlined" style="margin-right: 0.25rem;">add</span>
        </app-button>
        }
      </div>
      <span class="member-amount">
        {{ members.length }} member{{ members.length !== 1 ? 's' : '' }}
      </span>
    </div>
    <div class="person-row" *ngFor="let member of members">
      <img class="avatar" [src]="member.avatar" [alt]="member.username + ' - Học viên khóa học'" />
      <span class="person-name">{{ member.username }}</span>
    </div>
  </div>
</div>
