<div
  [class]="{
    'course-card': true,
    'scale-on-click': hasJoined,
}"
  (click)="handleClick()"
>
  <img
    [src]="course.imageUrl || '/images/mock-astronomy.jpg'"
    alt="Course title"
  />
  <div class="course-content">
    <h4>{{ course.title }}</h4>
    <p>{{ course.category }}</p>
    <!-- Removed Join button - Students can no longer freely join courses -->
    <!-- Teachers will add students to courses from the People tab -->
  </div>
</div>
